name: fsl_learn
description: Filipino Sign Language Learning System
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.3.1
  flutter_svg: ^2.2.1
  supabase_flutter: ^2.9.1

  # AI
  camera: ^0.11.2+1
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/models/
    - assets/sounds/
    - assets/fsl/alphabet/
    - assets/fsl/numbers/
    - assets/fsl/greetings/
    - assets/fsl/emergency/
    - assets/fsl/everyday/
    - assets/fsl/colors/
    - assets/fsl/animals/
